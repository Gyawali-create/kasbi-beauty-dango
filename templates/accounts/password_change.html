{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <h2 class="text-kasbi mb-4 text-center">Change Password</h2>
  <div class="card p-4 stat-card">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-kasbi w-100">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
