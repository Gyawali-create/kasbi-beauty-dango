{% extends 'base.html' %}
{% load static %}

{% block title %}Skincare — Kasbi Beauty{% endblock %}

{% block extra_head %}
<style>
/* ===== SKINCARE SPECIFIC FILTER STYLES ===== */
.filter-group .skin-type {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.filter-group .skin-type label {
    background: var(--cream);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 12px;
    transition: var(--transition);
    border: 1px solid transparent;
}

.filter-group .skin-type label:hover {
    border-color: var(--primary);
    background: var(--white);
}

.filter-group .skin-type input {
    margin-right: 6px;
}

/* ===== PRODUCT CARD BADGES ===== */
.product-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.product-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.product-badge.bestseller {
    background: #d66175;
    color: #fff;
}

.product-badge.new {
    background: #2ecc71;
    color: #fff;
}

.product-badge.discount {
    background: #e74c3c;
    color: #fff;
}

.product-link {
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.3s ease;
}

.product-link:hover {
    transform: translateY(-4px);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .filter-group .skin-type {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
{% endblock %}

{% block content %}
<!-- ===== SHOP SECTION ===== -->
<section class="shop-section">
    <!-- Filters -->
    <div class="filter-sidebar">
        <h3><i class="fa-solid fa-sliders" style="margin-right:10px;"></i>Filters</h3>

        <div class="filter-group" id="filterCategory">
            <h4>Categories</h4>
            <label><input type="checkbox" value="cleansers" checked> Cleansers</label>
            <label><input type="checkbox" value="serums" checked> Serums</label>
            <label><input type="checkbox" value="moisturizers" checked> Moisturizers</label>
            <label><input type="checkbox" value="sunscreen" checked> Sunscreen</label>
            <label><input type="checkbox" value="exfoliators" checked> Exfoliators</label>
            <label><input type="checkbox" value="facemasks" checked> Face Masks</label>
            <label><input type="checkbox" value="eyecreams" checked> Eye Creams</label>
            <label><input type="checkbox" value="toners" checked> Toners</label>
        </div>

        <div class="filter-group">
            <h4>Skin Type</h4>
            <div class="skin-type">
                <label><input type="checkbox" value="dry"> Dry</label>
                <label><input type="checkbox" value="oily"> Oily</label>
                <label><input type="checkbox" value="combination"> Combination</label>
                <label><input type="checkbox" value="sensitive"> Sensitive</label>
                <label><input type="checkbox" value="normal"> Normal</label>
                <label><input type="checkbox" value="alltypes"> All Types</label>
            </div>
        </div>

        <div class="filter-group">
            <h4>Skin Concerns</h4>
            <label><input type="checkbox" value="acne"> Acne</label>
            <label><input type="checkbox" value="aging"> Aging</label>
            <label><input type="checkbox" value="dark-spots"> Dark Spots</label>
            <label><input type="checkbox" value="dryness"> Dryness</label>
            <label><input type="checkbox" value="oil-control"> Oil Control</label>
            <label><input type="checkbox" value="brightening"> Brightening</label>
        </div>

        <div class="filter-group">
            <h4>Price Range</h4>
            <div class="price-range">
                <input type="text" id="priceMin" placeholder="Min" value="500">
                <span>—</span>
                <input type="text" id="priceMax" placeholder="Max" value="5000">
            </div>
        </div>

        <div class="filter-group" id="filterBrand">
            <h4>Brands</h4>
            <label><input type="checkbox" value="cerave"> CeraVe</label>
            <label><input type="checkbox" value="cetaphil"> Cetaphil</label>
            <label><input type="checkbox" value="theordinary"> The Ordinary</label>
            <label><input type="checkbox" value="loreal"> L'Oreal</label>
            <label><input type="checkbox" value="garnier"> Garnier</label>
            <label><input type="checkbox" value="innisfree"> Innisfree</label>
            <label><input type="checkbox" value="larocheposay"> La Roche-Posay</label>
            <label><input type="checkbox" value="cosrx"> COSRX</label>
            <label><input type="checkbox" value="laneige"> Laneige</label>
            <label><input type="checkbox" value="simple"> Simple</label>
            <label><input type="checkbox" value="plum"> Plum</label>
            <label><input type="checkbox" value="mamaearth"> Mamaearth</label>
        </div>

        <div class="filter-group">
            <h4>Rating</h4>
            <label><input type="radio" name="rating" value="5" checked> ★★★★★ &amp; up</label>
            <label><input type="radio" name="rating" value="4"> ★★★★☆ &amp; up</label>
            <label><input type="radio" name="rating" value="3"> ★★★☆☆ &amp; up</label>
            <label><input type="radio" name="rating" value="all"> All Ratings</label>
        </div>

        <button class="btn-filter" id="applyFilters"><i class="fa-solid fa-rotate-right"></i> Apply Filters</button>
        <button class="btn-filter btn-filter-clear" id="clearFilters" style="margin-top:10px; width:100%;"><i class="fa-solid fa-times"></i> Clear Filters</button>
    </div>

    <!-- Products -->
    <div>
        <div class="shop-toolbar">
            <span id="productCount">Showing 1–12 of 120 products</span>
            <select id="sortSelect">
                <option value="default">Sort by: Default</option>
                <option value="price-low">Sort by: Price: Low to High</option>
                <option value="price-high">Sort by: Price: High to Low</option>
                <option value="rating">Sort by: Rating</option>
            </select>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will be dynamically loaded here -->
        </div>

        <div class="pagination" id="pagination">
            <!-- Pagination will be dynamically generated -->
        </div>
    </div>
</section>

// ===== PRODUCTS PER PAGE =====
const productsPerPage = 12;
let currentPage = 1;
let filteredProducts = [...allProducts];

function getInitials(name) {
    return name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
}

function renderProducts(page = 1) {
    const grid = document.getElementById('productGrid');
    const start = (page - 1) * productsPerPage;
    const end = start + productsPerPage;
    const pageItems = filteredProducts.slice(start, end);
    const total = filteredProducts.length;
    const totalPages = Math.ceil(total / productsPerPage);

    if (total === 0) {
        grid.innerHTML = `
            <div class="no-results">
                <i class="fa-regular fa-face-frown"></i>
                <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 24px; color: #1A1A2E; margin-bottom: 8px;">No Products Found</h3>
                <p>Try adjusting your filters or search for something else.</p>
            </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        document.getElementById('productCount').textContent = 'Showing 0 products';
        return;
    }

    grid.innerHTML = pageItems.map(product => {
        let badgesHTML = '';
        if (product.badge === 'bestseller') {
            badgesHTML += `<span class="product-badge bestseller">⭐ Best Seller</span>`;
        } else if (product.badge === 'new') {
            badgesHTML += `<span class="product-badge new">✨ New</span>`;
        }

        const discount = product.oldPrice ? Math.round((1 - product.price / product.oldPrice) * 100) : 0;
        if (discount > 0) {
            badgesHTML += `<span class="product-badge discount">-${discount}%</span>`;
        }

        let stars = '';
        for (let i = 0; i < 5; i++) stars += i < product.rating ? '★' : '☆';

        const oldPriceHTML = product.oldPrice ? `<span class="old">Rs.${product.oldPrice.toLocaleString()}</span>` : '';
        const initials = getInitials(product.name);

        return `
            <a href="/product/${product.id}/" class="product-link">
                <div class="product-card" data-category="${product.category}" data-brand="${product.brand.toLowerCase().replace(/[^a-z]/g, '')}" data-price="${product.price}" data-rating="${product.rating}">
                    <div class="image-wrap">
                        <span class="wishlist" onclick="event.preventDefault();event.stopPropagation();toggleWishlist(this);"><i class="fa-regular fa-heart"></i></span>
                        <svg viewBox="0 0 200 200" style="position:absolute;inset:0;width:100%;height:100%;">
                            <rect width="200" height="200" fill="#eee6d8"/>
                            <text x="100" y="108" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#1A1A2E" text-anchor="middle">${initials}</text>
                        </svg>
                    </div>
                    <div class="info">
                        ${badgesHTML ? `<div class="product-badges">${badgesHTML}</div>` : ''}
                        <span class="brand">${product.brand}</span>
                        <h3>${product.name}</h3>
                        <div class="rating">${stars} <span>(${product.ratingCount})</span></div>
                        <div class="price">
                            <span class="current">Rs.${product.price.toLocaleString()}</span>
                            ${oldPriceHTML}
                        </div>
                        <button class="add-btn" onclick="event.preventDefault();event.stopPropagation();addToCart(this, '${product.name}');">
                            <i class="fa-solid fa-cart-plus" style="margin-right:8px;"></i>Add To Cart
                        </button>
                    </div>
                </div>
            </a>
        `;
    }).join('');

    renderPagination(totalPages, page);
    const startNum = (page - 1) * productsPerPage + 1;
    const endNum = Math.min(page * productsPerPage, total);
    document.getElementById('productCount').textContent = `Showing ${startNum}–${endNum} of ${total} products`;
}

function renderPagination(totalPages, current) {
    const wrap = document.getElementById('pagination');
    if (totalPages <= 1) { wrap.innerHTML = ''; return; }

    let html = `<a href="#" onclick="event.preventDefault();goToPage(${current - 1});" ${current === 1 ? 'style="opacity:0.4;pointer-events:none;"' : ''}><i class="fa-solid fa-chevron-left"></i></a>`;
    
    for (let n = 1; n <= totalPages; n++) {
        if (n === 1 || n === totalPages || Math.abs(n - current) <= 1) {
            html += `<a href="#" onclick="event.preventDefault();goToPage(${n});" class="${n === current ? 'active' : ''}">${n}</a>`;
        } else if (Math.abs(n - current) === 2) {
            html += `<span style="padding:0 8px;color:#bbb;">…</span>`;
        }
    }

    html += `<a href="#" onclick="event.preventDefault();goToPage(${current + 1});" ${current === totalPages ? 'style="opacity:0.4;pointer-events:none;"' : ''}><i class="fa-solid fa-chevron-right"></i></a>`;
    wrap.innerHTML = html;
}

function goToPage(page) {
    const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderProducts(page);
    document.querySelector('.shop-toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function filterProducts() {
    // Get categories by specifically targeting the first filter-group (#filterCategory)
    const selectedCategories = [];
    document.querySelectorAll('#filterCategory input[type="checkbox"]:checked').forEach(cb => {
        selectedCategories.push(cb.value);
    });

    // Get brands by specifically targeting the third filter-group (#filterBrand)
    const selectedBrands = [];
    document.querySelectorAll('#filterBrand input[type="checkbox"]:checked').forEach(cb => {
        selectedBrands.push(cb.value);
    });

    const ratingRadio = document.querySelector('input[name="rating"]:checked');
    const selectedRating = ratingRadio ? ratingRadio.value : 'all';

    const minPrice = parseInt(document.getElementById('priceMin').value) || 0;
    const maxPrice = parseInt(document.getElementById('priceMax').value) || Infinity;

    filteredProducts = allProducts.filter(product => {
        const categoryMatch = selectedCategories.length === 0 || selectedCategories.includes(product.category);
        const brandMatch = selectedBrands.length === 0 || selectedBrands.includes(product.brand.toLowerCase().replace(/[^a-z]/g, ''));
        const ratingMatch = selectedRating === 'all' || product.rating >= parseInt(selectedRating);
        const priceMatch = product.price >= minPrice && product.price <= maxPrice;
        return categoryMatch && brandMatch && ratingMatch && priceMatch;
    });

    sortProducts();
    currentPage = 1;
    renderProducts(1);
}

function sortProducts() {
    const sortValue = document.getElementById('sortSelect').value;
    if (sortValue === 'price-low') {
        filteredProducts.sort((a, b) => a.price - b.price);
    } else if (sortValue === 'price-high') {
        filteredProducts.sort((a, b) => b.price - a.price);
    } else if (sortValue === 'rating') {
        filteredProducts.sort((a, b) => b.rating - a.rating || b.ratingCount - a.ratingCount);
    } else {
        filteredProducts.sort((a, b) => a.id - b.id);
    }
}

function toggleWishlist(element) {
    const icon = element.querySelector('i');
    const productCard = element.closest('.product-card');
    const productName = productCard ? productCard.querySelector('h3').textContent : 'Product';
    
    icon.classList.toggle('fa-regular');
    icon.classList.toggle('fa-solid');
    
    if (icon.classList.contains('fa-solid')) {
        element.style.background = '#d66175';
        element.style.color = '#fff';
        element.style.borderColor = '#d66175';
        element.style.transform = 'scale(1.2)';
        setTimeout(() => { element.style.transform = ''; }, 300);
        showToast(`❤️ ${productName} added to Wishlist!`);
    } else {
        element.style.background = '#fff';
        element.style.color = '#ccc';
        element.style.borderColor = '#eee';
        showToast(`💔 ${productName} removed from Wishlist`);
    }
}

function addToCart(button, productName) {
    const originalText = button.innerHTML;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i>Adding...';
    button.style.background = '#d66175';
    button.style.color = '#fff';
    button.disabled = true;
    
    setTimeout(() => {
        button.innerHTML = '<i class="fa-solid fa-check" style="margin-right:8px;"></i>Added!';
        button.style.background = '#2ecc71';
        button.style.color = '#fff';
        updateCartBadge();
        showToast(`✅ ${productName} added to cart!`);
        
        setTimeout(() => {
            button.innerHTML = originalText;
            button.style.background = '#d66175';
            button.style.color = '#fff';
            button.disabled = false;
        }, 2000);
    }, 700);
}

let cartCount = 3;
function updateCartBadge() {
    cartCount++;
    const badge = document.querySelector('.cart-badge');
    if (badge) {
        badge.textContent = cartCount;
        badge.style.animation = 'none';
        setTimeout(() => {
            badge.style.animation = 'badgePulse 0.5s ease';
        }, 10);
    }
}

function showToast(message) {
    const existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #1A1A2E;
        color: white;
        padding: 14px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        z-index: 10000;
        animation: slideInUp 0.4s ease forwards;
        font-family: 'Inter', sans-serif;
        max-width: 350px;
        border-left: 4px solid #d66175;
    `;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.animation = 'slideOutDown 0.4s ease forwards';
        setTimeout(() => { toast.remove(); }, 400);
    }, 3000);
}

// Add CSS animations
const styleSheet = document.createElement('style');
styleSheet.textContent = `
    @keyframes slideInUp {
        0% { transform: translateY(100px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideOutDown {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(100px); opacity: 0; }
    }
    @keyframes badgePulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.4); }
        100% { transform: scale(1); }
    }
    .toast-notification {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #1A1A2E;
        color: white;
        padding: 14px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        z-index: 10000;
        animation: slideInUp 0.4s ease forwards;
        font-family: 'Inter', sans-serif;
        max-width: 350px;
        border-left: 4px solid #d66175;
    }
`;
document.head.appendChild(styleSheet);

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    renderProducts(1);
    
    // Event listeners
    document.getElementById('applyFilters').addEventListener('click', filterProducts);
    document.getElementById('clearFilters').addEventListener('click', function() {
        document.querySelectorAll('#filterCategory input[type="checkbox"]').forEach(cb => cb.checked = true);
        document.querySelectorAll('#filterBrand input[type="checkbox"]').forEach(cb => cb.checked = false);
        document.querySelector('input[name="rating"][value="all"]').checked = true;
        document.getElementById('priceMin').value = '500';
        document.getElementById('priceMax').value = '5000';
        document.getElementById('sortSelect').value = 'default';
        filterProducts();
    });
    document.getElementById('sortSelect').addEventListener('change', function() {
        sortProducts();
        currentPage = 1;
        renderProducts(1);
    });
    
    // Price input validation
    document.querySelectorAll('.price-range input').forEach(input => {
        input.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    });
});
